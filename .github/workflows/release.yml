name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://npm.pkg.github.com
      - run: npm ci
      # Branch protection is unavailable on this plan for private repos, so the
      # release job itself is the gate: nothing publishes unless the full
      # contract battery passes on the exact commit being released.
      - name: Gates (manifest, props, tokens, css contract, tests, raw colors, token purity)
        run: |
          npm run verify
          npm run props
          npm run tokens
          npm run test:props
          npm run test:css-contract
          npm run test:contrast
          npm run test:template-contract
          npm run test:specimens
          npm run test:review-gate
          node scripts/check-pure-token-file.mjs
          node scripts/check-raw-colors.mjs
          npx vitest run
      # The measured input contract needs a browser, so it installs one here.
      # It belongs in this job and not only in PR CI: with branch protection
      # unavailable, THIS is the gate, and a check that runs on the PR but not
      # before publish is a check the release can walk past.
      - name: Install Chromium for the contract suite
        run: npx playwright install --with-deps chromium
      - name: Input contract (names, geometry, painted contrast, focus, iframe consumer)
        run: npm run test:contract
      - run: npm run build
      - name: Packed artifact (every contract file by exact path)
        run: npm run test:packed
      - name: Input parity record (allowlist owners + unexpired expiries)
        run: npm run test:parity
      - name: Visibility-reasons contract (shared list, conformance, declarations)
        run: npm run test:reasons
      - name: Consumer-typing probe (public surface compiles under strict consumer TS)
        run: npm run test:types
      - name: Exports contract (packed tarball resolves all consumer specifiers)
        run: npm run check:exports
      - name: Create release PR or publish to GitHub Packages
        uses: changesets/action@v1
        with:
          publish: npx changeset publish
          # A single command on purpose: changesets/action passes this to
          # @actions/exec, not a shell, so `&&` here would become a literal
          # argument. The chaining lives in the npm script instead.
          version: npm run release:version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
