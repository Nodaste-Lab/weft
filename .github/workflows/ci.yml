name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # design-system-props.mjs diffs the snapshot against the PR base ref
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Manifest verify (uiPrimitives ↔ src/ui, semver, version integrity)
        run: npm run verify
      - name: Prop-contract snapshot gate
        run: npm run props
      - name: Prop-gate unit tests
        run: npm run test:props
      - name: Pure token file invariant (weft.css stays injection-safe)
        run: node scripts/check-pure-token-file.mjs
      - name: Token-value lockfile (values change only with a version bump)
        run: npm run tokens
      - name: CSS semantics + contrast contract
        run: npm run test:css-contract
      - name: Contrast contract (AA on paper, both themes)
        run: npm run test:contrast
      - name: Template contract (weft-board template layer)
        run: npm run test:template-contract
      - name: Input-specimen contract (generator determinism + page freshness)
        run: npm run test:specimens
      - name: Review-gate harness (constraint discovery, refusals, preflight)
        run: npm run test:review-gate
      - name: Raw-color audit (tokens only outside css/)
        run: node scripts/check-raw-colors.mjs
      - name: Unit + a11y tests
        run: npx vitest run
      - name: Build (ESM bundle)
        run: npm run build
      - name: Exports-map contract (resolve every consumer specifier from the packed tarball)
        run: npm run check:exports
      - name: Packed artifact (every contract file by exact path)
        run: npm run test:packed
      - name: Input parity record (allowlist owners + unexpired expiries)
        run: npm run test:parity

  visual-regression:
    runs-on: ubuntu-latest
    # Pinned Playwright image so Chromium + fonts match the committed Linux
    # baselines (regenerate with scripts/update-visual-baselines.sh).
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-jammy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # The measured contract suites run here rather than in `verify` because
      # this job's image already carries Chromium. They are the gate; the pixel
      # baselines below are a regression alarm that runs after them.
      - run: npm run test:contract
      - run: npm run test:visual
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  react-19-smoke:
    # The peer range allows ^19 but the primitives were extracted on 18.3.1
    # (and react-day-picker's own peers cap at 18). This job proves the suite
    # under React 19 before any consumer imports the React entry on 19.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm install --no-save react@19 react-dom@19 @types/react@19 2>/dev/null || npm install --no-save --legacy-peer-deps react@19 react-dom@19
      - run: npx vitest run
